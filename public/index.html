<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><title>Tasks</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head><body><div id="skeleton"><div class="bar shimmer"></div><div class="block shimmer"></div><div class="block shimmer"></div><div class="block shimmer"></div></div><div id="app" hidden><header><b>Tasks<span>.</span></b><button id="profile" aria-label="アカウント">◯</button></header><main><div class="intro"><small id="date"></small><h1>今日のタスク</h1><p id="progress-count"></p><div class="progress"><div id="progress-fill"></div></div></div><form id="capture"><input id="quick-input" aria-label="タスク入力" placeholder="タスクを入力…" maxlength="240" autocomplete="off" autofocus><button aria-label="追加">↑</button></form><p class="hint">左にスワイプで完了 · 右にスワイプで進行中</p><nav class="filters" aria-label="ステータス"><button data-filter="all" class="selected">すべて</button><button data-filter="todo">未着手</button><button data-filter="doing">進行中</button><button data-filter="done">完了</button></nav><div id="list"></div><p id="empty" hidden>タスクはありません</p><button id="ai-trigger" class="ai">✧ AIで整理</button></main><footer><button id="home">タスク</button><button id="fab" aria-label="新しいタスク">＋</button><button id="ai-nav">AI</button></footer></div><dialog id="ai-dialog"><form method="dialog"><button class="close" value="cancel">×</button><h2>AIで整理</h2><textarea id="ai-input" placeholder="やることをまとめて入力" rows="5"></textarea><p id="ai-error" role="alert"></p><button id="ai-run" type="button">タスクに分解する</button></form></dialog><dialog id="account-dialog"><button id="account-close">×</button><h2>アカウント</h2><p id="account-name"></p><button id="logout">ログアウト</button></dialog><div id="toast" role="status"></div></body></html>
